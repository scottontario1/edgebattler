<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1222" />
    <title>Chronicle of Ashvale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>

    <div class="hud">
      <header class="panel objective" aria-label="Objective">
        <div class="eyebrow">Chapter I · The River Ford</div>
        <div class="goal"><i class="gem"></i>Seize the Keep</div>
        <div class="sub">or rout the enemy</div>
      </header>

      <section class="panel turn" aria-label="Turn">
        <div class="turn-row">
          <span class="turn-no">Turn <b id="turn-no">1</b></span>
          <span id="phase" class="phase blue">Player Phase</span>
        </div>
        <nav id="roster" class="roster" aria-label="Units"></nav>
      </section>

      <div class="dock">
        <div id="terrain" class="chip terrain" aria-live="polite"></div>
        <aside id="card" class="panel card" aria-live="polite"></aside>
      </div>

      <nav id="actions" class="actions" aria-label="Actions"></nav>

      <section id="sheet" class="panel sheet" hidden aria-label="Unit details"></section>

      <div class="hint">Click a unit, then a blue tile to move · A attack · W wait · E end turn · Drag or right-drag to pan · Wheel to zoom · D danger zone · G grid · H <span id="hd">HD on</span> · M <span id="models">illustrated models</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
